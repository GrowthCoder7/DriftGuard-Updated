[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-demo-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "fastapi",
    "uvicorn",
    "pyyaml"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]