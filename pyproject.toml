[project]
name = "driftguard"
version = "0.1.0"
description = "DriftGuard frozen core"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml",
    "httpx",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "pyyaml>=6.0.1",
    "feedparser>=6.0.14",
    "selectolax>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "coverage",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=src/driftguard --cov-fail-under=70 --cov-report=term-missing"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["driftguard.models.*", "driftguard.protocols","driftguard.split.*",
    "driftguard.impact.*"]
strict = true

[tool.ruff.lint.per-file-ignores]
"src/driftguard/inventory/*" = ["BLE001"]

[tool.coverage.run]
source = ["src/driftguard/models", "src/driftguard/fetch", "src/driftguard/inventory"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest-cov>=7.1.0",
]
