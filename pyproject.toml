[project]
name = "driftguard"
version = "0.1.0"
description = "DriftGuard frozen core"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "coverage",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.pytest.ini_options]
addopts = "--cov=src/driftguard/models --cov-fail-under=85"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["driftguard.models.*", "driftguard.protocols"]
strict = true